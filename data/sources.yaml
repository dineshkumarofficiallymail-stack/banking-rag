    filename: rbi_kyc_master_direction.html
  - title: "RBI - Harmonisation of Turn Around Time (TAT) and customer compensation for failed transactions"
    regulator: RBI
    doc_type: circular
    url: "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11693"
    filename: rbi_failed_txn_tat_compensation.html
  - title: "NPCI NACH - Procedural Guidelines"
    regulator: NACH
    doc_type: procedural_guidelines
    url: "https://www.npci.org.in/what-we-do/nach/circulars"
    filename: npci_nach_procedural_guidelines.html
