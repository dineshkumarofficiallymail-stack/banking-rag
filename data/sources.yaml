# Public regulatory documents to download + ingest.
# Copy exact PDF/HTML links from rbi.org.in (Notifications / Master Directions) and npci.org.in (NACH circulars).
# `filename` is where the file lands under data/raw/. `regulator` must be RBI | NPCI | NACH | OTHER.
sources:
  - title: "RBI Master Direction - Know Your Customer (KYC) Direction, 2016"
    regulator: RBI
